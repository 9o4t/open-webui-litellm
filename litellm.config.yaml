# Local-only fallback if you run LiteLLM without STORE_MODEL_IN_DB.
# On Railway the template sets STORE_MODEL_IN_DB=True and you add models
# in the LiteLLM admin UI after pasting optional provider keys.

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
